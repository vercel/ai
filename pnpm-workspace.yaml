packages:
  - 'apps/*'
  - 'packages/*'
  - 'tools/*'
  - 'examples/*'
  - 'packages/rsc/tests/e2e/next-server'

overrides:
  tinyexec: 1.0.2
  oxlint: 1.56.0
  tar: 7.5.19

minimumReleaseAge: 4320 # 3 days

minimumReleaseAgeExclude:
  # First-party packages may be consumed immediately as part of their release flow.
  - '@ai-sdk/*'
  - '@vercel/*'
  - 'ai'

allowBuilds:
  '@google/genai': false
  '@mongodb-js/zstd': false
  '@nestjs/core': false
  '@parcel/watcher': false
  '@sentry/cli': false
  '@swc/core': false
  '@xai-official/grok': false
  cbor-extract: false
  esbuild: true
  lmdb: false
  msgpackr-extract: false
  msw: false
  node-liblzma: false
  protobufjs: false
  sharp: false

catalog:
  '@types/node': 22.19.19
  '@types/react': ^18.3.28
  '@types/react-dom': ^18.3.7
  '@types/ws': ^8.5.13
  '@testing-library/jest-dom': ^6.9.1
  autoprefixer: ^10.5.0
  clsx: ^2.1.1
  postcss: ^8.5.14
  tsup: ^8.5.1
  tsx: 4.23.12
  typescript: 5.8.3
  vitest: ^4.1.11
  ws: ^8.21.0
  zod: 4.4.3
