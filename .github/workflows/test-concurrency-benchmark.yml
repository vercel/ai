name: Test concurrency benchmark
'on':
  push:
    branches:
      - codex/ci-test-concurrency-benchmark
permissions:
  contents: read
  actions: read
jobs:
  benchmark:
    name: Node ${{ matrix.node }} / ${{ matrix.trial.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: 22
            trial:
              name: balanced-order-1
              cases: 16:default 2:3 4:2
          - node: 22
            trial:
              name: balanced-order-2
              cases: 2:3 4:2 16:default
          - node: 22
            trial:
              name: balanced-order-3
              cases: 4:2 16:default 2:3
          - node: 24
            trial:
              name: paired-forward
              cases: 2:3 4:2
          - node: 24
            trial:
              name: paired-reverse
              cases: 4:2 2:3
          - node: 26
            trial:
              name: paired-forward
              cases: 2:3 4:2
          - node: 26
            trial:
              name: paired-reverse
              cases: 4:2 2:3
    steps:
      - name: Checkout identical tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 897e930dcfbad27bcfe44b45b935aa2599ac83de
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download identical package build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: package-build-artifacts
          run-id: 37960649691
          github-token: ${{ github.token }}
      - name: Extract package build artifacts
        run: tar -xzf package-build-artifacts.tgz
      - name: Measure full package test suite without cache reads
        env:
          SKIP_RSC_E2E: '1'
          TEST_NODE_VERSION: ${{ matrix.node }}
          BENCHMARK_CASES: ${{ matrix.trial.cases }}
          BENCHMARK_TRIAL: ${{ matrix.trial.name }}
        run: |
          mkdir -p benchmark-results
          BENCHMARK_ORDER=0
          OVERALL_STATUS=0
          for BENCHMARK_CASE in $BENCHMARK_CASES; do
            BENCHMARK_ORDER=$((BENCHMARK_ORDER + 1))
            export BENCHMARK_ORDER
            export BENCHMARK_PACKAGES="${BENCHMARK_CASE%:*}"
            export BENCHMARK_WORKERS="${BENCHMARK_CASE#*:}"
            export BENCHMARK_SETTING="packages-$BENCHMARK_PACKAGES-workers-$BENCHMARK_WORKERS"
            export BENCHMARK_REPEAT="$BENCHMARK_TRIAL"
            export BENCHMARK_DIRECTORY="benchmark-results/$BENCHMARK_ORDER-$BENCHMARK_SETTING"
            mkdir -p "$BENCHMARK_DIRECTORY"
          node --version
          pnpm --version
          nproc
          git rev-parse HEAD
          if [ "$BENCHMARK_WORKERS" = default ]; then
            unset VITEST_MAX_WORKERS
          else
            export VITEST_MAX_WORKERS="$BENCHMARK_WORKERS"
          fi
          set +e
          /usr/bin/time -f 'elapsed_seconds=%e\nuser_seconds=%U\nsystem_seconds=%S\nmax_rss_kb=%M' -o "$BENCHMARK_DIRECTORY/time.txt" \
            pnpm exec turbo test --concurrency="$BENCHMARK_PACKAGES" \
              --filter='!@example/*' --filter='!ai' --filter='!@ai-sdk/codemod' \
              --only --cache=local:w --summarize 2>&1 | tee "$BENCHMARK_DIRECTORY/tests.log"
          TEST_STATUS=${PIPESTATUS[0]}
          set -e
          export TEST_STATUS
          cp .turbo/runs/*.json "$BENCHMARK_DIRECTORY/" || true
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          root = pathlib.Path(os.environ['BENCHMARK_DIRECTORY'])
          metrics = dict(line.split('=', 1) for line in (root / 'time.txt').read_text().splitlines() if '=' in line)
          result = {
              'setting': os.environ['BENCHMARK_SETTING'],
              'packages': int(os.environ['BENCHMARK_PACKAGES']),
              'workers': os.environ['BENCHMARK_WORKERS'],
              'repeat': os.environ['BENCHMARK_REPEAT'],
              'order': int(os.environ['BENCHMARK_ORDER']),
              'node': subprocess.check_output(['node', '--version'], text=True).strip(),
              'cpus': os.cpu_count(),
              'cpu_model': next((line.split(':', 1)[1].strip() for line in pathlib.Path('/proc/cpuinfo').read_text().splitlines() if line.startswith('model name')), ''),
              'available_parallelism': subprocess.check_output(['node', '-p', 'require("node:os").availableParallelism()'], text=True).strip(),
              'revision': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'exit_code': int(os.environ['TEST_STATUS']),
              'metrics': metrics,
          }
          (root / 'result.json').write_text(json.dumps(result, indent=2) + '\n')
          print(json.dumps(result, indent=2))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f"{result['setting']}, repeat {result['repeat']}, Node {result['node']}, {result['cpus']} CPUs: {metrics['elapsed_seconds']} seconds, exit {result['exit_code']}.\n")
          PY
          if [ "$TEST_STATUS" -ne 0 ]; then OVERALL_STATUS="$TEST_STATUS"; fi
          done
          exit "$OVERALL_STATUS"
      - name: Upload measurements and failure diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: benchmark-node-${{ matrix.node }}-${{ matrix.trial.name }}
          path: benchmark-results/
