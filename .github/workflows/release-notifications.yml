name: Release Notifications

on:
  workflow_run:
    workflows:
      - Release
    types:
      - completed

permissions:
  actions: read
  contents: read
  pull-requests: write
  issues: write

jobs:
  notify:
    # The release workflow itself only runs for this repository. Keep the same
    # guard here so a successful no-op run in a fork does not try to download a
    # manifest that was never created.
    if: >-
      github.repository_owner == 'vercel' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Download notification manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-notification
          path: .release-notification
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Read notification manifest
        id: notification
        run: |
          manifest=.release-notification/notification.json
          echo "type=$(jq -r '.type' "$manifest")" >> "$GITHUB_OUTPUT"
          echo "published-packages=$(jq -c '.publishedPackages // []' "$manifest")" >> "$GITHUB_OUTPUT"
          echo "pull-request-number=$(jq -r '.pullRequestNumber // empty' "$manifest")" >> "$GITHUB_OUTPUT"
          echo "has-published-packages=$(jq '(.publishedPackages | length) > 0' "$manifest")" >> "$GITHUB_OUTPUT"

      - name: Notify released PRs and issues
        if: >-
          steps.notification.outputs.type == 'release' &&
          steps.notification.outputs.has-published-packages == 'true'
        uses: ./.github/actions/notify-released
        with:
          published-packages: ${{ steps.notification.outputs.published-packages }}
          pull-request-number: ${{ steps.notification.outputs.pull-request-number }}
