name: Release

on:
  push:
    branches:
      - main
      - release-v*
    paths:
      - '.changeset/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:

concurrency:
  group: 'release-${{ github.ref_name }}'
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    # do not attempt running in forks
    if: github.repository_owner == 'vercel'
    environment: npm-release
    steps:
      - name: Configure Git
        run: |
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.4

      - name: Setup Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # (22.22.2 is broken)
          node-version: 22.22.1

      - name: Update npm to v11
        run: npm install --global npm@11

      - name: Install Dependencies
        run: pnpm i

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version: pnpm ci:version
          publish: pnpm ci:release
          setupGitUser: false
          # When using "github-api", all commits and tags are GPG-signed and attributed to the user or app who owns the GITHUB_TOKEN
          commitMode: 'github-api'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN_ELEVATED }}

      - name: Find release PR number
        if: steps.changesets.outputs.published == 'true'
        id: release-pr
        run: echo "number=$(gh api repos/${{ github.repository }}/commits/${{ github.sha }}/pulls --jq '.[0].number')" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release notification manifest
        run: |
          mkdir -p .release-notification
          jq -n \
            --arg publishedPackages "$PUBLISHED_PACKAGES" \
            --arg pullRequestNumber "$PULL_REQUEST_NUMBER" \
            '{
              type: "release",
              publishedPackages: ($publishedPackages | fromjson? // []),
              pullRequestNumber: $pullRequestNumber
            }' > .release-notification/notification.json
        env:
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.publishedPackages }}
          PULL_REQUEST_NUMBER: ${{ steps.release-pr.outputs.number }}

      - name: Upload release notification manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notification
          path: .release-notification
          include-hidden-files: true
          retention-days: 1
