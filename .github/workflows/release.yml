name: Release

on:
  push:
    branches:
      - main
      - release-v*
    paths:
      - '.changeset/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:

concurrency:
  group: 'release-${{ github.ref_name }}'
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    # do not attempt running in forks
    if: github.repository_owner == 'vercel'
    environment: npm-release
    steps:
      - name: Configure Git
        run: |
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.33.4

      - name: Setup Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install Dependencies
        run: pnpm i

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        continue-on-error: true
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version: pnpm ci:version
          publish: pnpm ci:release
          setupGitUser: false
          # When using "github-api", all commits and tags are GPG-signed and attributed to the user or app who owns the GITHUB_TOKEN
          commitMode: 'github-api'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN_ELEVATED }}

      # Only retry release PR preparation. Publishing may have partially succeeded.
      # Versioning consumes changesets, so restore the original checkout and lockfile
      # before each retry to avoid accidentally entering the publishing path.
      - name: Prepare release PR retry 1
        id: prepare-retry-1
        if: >-
          steps.changesets.outcome == 'failure' &&
          steps.changesets.outputs.hasChangesets == 'true'
        run: |
          sleep 30
          git reset --hard "$RELEASE_SHA"
          git clean -fd
          pnpm install --frozen-lockfile
        env:
          RELEASE_SHA: ${{ github.sha }}

      - name: Retry release PR preparation 1
        id: changesets-retry-1
        if: steps.prepare-retry-1.outcome == 'success'
        continue-on-error: true
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version: pnpm ci:version
          publish: pnpm ci:release
          setupGitUser: false
          commitMode: 'github-api'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare release PR retry 2
        id: prepare-retry-2
        if: >-
          steps.changesets-retry-1.outcome == 'failure' &&
          steps.changesets-retry-1.outputs.hasChangesets == 'true'
        run: |
          sleep 60
          git reset --hard "$RELEASE_SHA"
          git clean -fd
          pnpm install --frozen-lockfile
        env:
          RELEASE_SHA: ${{ github.sha }}

      - name: Retry release PR preparation 2
        id: changesets-retry-2
        if: steps.prepare-retry-2.outcome == 'success'
        continue-on-error: true
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version: pnpm ci:version
          publish: pnpm ci:release
          setupGitUser: false
          commitMode: 'github-api'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check Changesets result
        if: >-
          !cancelled() &&
          steps.changesets.outcome == 'failure' &&
          steps.changesets-retry-1.outcome != 'success' &&
          steps.changesets-retry-2.outcome != 'success'
        run: |
          echo "::error::Changesets did not complete successfully."
          exit 1

      # Publishing only runs on the first attempt, which owns notification outputs.
      - name: Find release PR number
        if: steps.changesets.outputs.published == 'true'
        id: release-pr
        run: echo "number=$(gh api repos/${{ github.repository }}/commits/${{ github.sha }}/pulls --jq '.[0].number')" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release notification manifest
        run: |
          mkdir -p .release-notification
          jq -n \
            --arg publishedPackages "$PUBLISHED_PACKAGES" \
            --arg pullRequestNumber "$PULL_REQUEST_NUMBER" \
            '{
              type: "release",
              publishedPackages: ($publishedPackages | fromjson? // []),
              pullRequestNumber: $pullRequestNumber
            }' > .release-notification/notification.json
        env:
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.publishedPackages }}
          PULL_REQUEST_NUMBER: ${{ steps.release-pr.outputs.number }}

      - name: Upload release notification manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notification
          path: .release-notification
          include-hidden-files: true
          retention-days: 1
