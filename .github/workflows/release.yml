name: Release

on:
  push:
    branches:
      - main
      - release-v*
    paths:
      - '.changeset/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      snapshot:
        description: 'Publish a snapshot release instead of a normal release'
        type: boolean
        default: false

concurrency:
  group: 'release-${{ github.ref_name }}'
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    # do not attempt running in forks
    if: github.repository_owner == 'vercel'
    steps:
      - name: Configure Git
        run: |
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3
        with:
          runtime: node@24
          require-lockfile: true

      # Normal release path
      - name: Find existing release PR
        if: inputs.snapshot != true
        id: existing-release-pr
        run: |
          number=$(gh pr list --repo "$GITHUB_REPOSITORY" \
            --base "$GITHUB_REF_NAME" --head "changeset-release/$GITHUB_REF_NAME" \
            --state open --json number --jq '.[0].number // empty')
          echo "number=$number" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release Pull Request or Publish to npm
        if: inputs.snapshot != true
        id: changesets
        continue-on-error: true
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: pnpm ci:version
          publish: pnpm ci:release
          setupGitUser: false
          # When using "github-api", all commits and tags are GPG-signed and attributed to the user or app who owns the GITHUB_TOKEN
          commitMode: 'github-api'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check failed release attempt
        if: steps.changesets.outcome == 'failure'
        run: |
          # A concurrent merge can delete the branch Changesets is updating.
          # Only defer PR updates; publishing failures must still fail the job.
          if [[ "$HAS_CHANGESETS" == true && -n "$RELEASE_PR" ]] &&
            [[ "$(gh pr view "$RELEASE_PR" --repo "$GITHUB_REPOSITORY" --json state --jq .state)" == MERGED ]]; then
            echo "::notice::Release PR #$RELEASE_PR merged during this run; its push will run the release workflow again."
          else
            echo "::error::Changesets failed without a concurrent release PR merge."
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HAS_CHANGESETS: ${{ steps.changesets.outputs.hasChangesets }}
          RELEASE_PR: ${{ steps.existing-release-pr.outputs.number }}

      - name: Find release PR number
        if: inputs.snapshot != true && steps.changesets.outputs.published == 'true'
        id: release-pr
        run: echo "number=$(gh api repos/${{ github.repository }}/commits/${{ github.sha }}/pulls --jq '.[0].number')" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release notification manifest
        if: inputs.snapshot != true
        run: |
          mkdir -p .release-notification
          jq -n \
            --arg publishedPackages "$PUBLISHED_PACKAGES" \
            --arg pullRequestNumber "$PULL_REQUEST_NUMBER" \
            '{
              type: "release",
              publishedPackages: ($publishedPackages | fromjson? // []),
              pullRequestNumber: $pullRequestNumber
            }' > .release-notification/notification.json
        env:
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.publishedPackages }}
          PULL_REQUEST_NUMBER: ${{ steps.release-pr.outputs.number }}

      - name: Upload release notification manifest
        if: inputs.snapshot != true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notification
          path: .release-notification
          include-hidden-files: true
          retention-days: 1

      # Snapshot release path
      - name: Add SHORT_SHA env property with commit short sha
        if: inputs.snapshot == true
        run: echo "SHORT_SHA=`echo ${{ github.sha }} | cut -c1-8`" >> $GITHUB_ENV

      - name: Delete pre.json if it exists
        if: inputs.snapshot == true
        run: rm -f .changeset/pre.json

      - name: Version Packages (snapshot)
        if: inputs.snapshot == true
        run: pnpm changeset version --snapshot ${SHORT_SHA}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean Examples
        if: inputs.snapshot == true
        run: pnpm clean-examples

      - name: Build
        if: inputs.snapshot == true
        run: pnpm clean && pnpm build

      - name: Publish Snapshot Release
        if: inputs.snapshot == true
        run: pnpm changeset publish --no-git-tag --tag snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create snapshot notification manifest
        if: inputs.snapshot == true
        run: |
          mkdir -p .release-notification
          jq -n '{ type: "snapshot" }' > .release-notification/notification.json
          find packages -mindepth 2 -maxdepth 2 -name package.json -print0 |
            tar --null -T - -cf - |
            tar -xf - -C .release-notification

      - name: Upload snapshot notification manifest
        if: inputs.snapshot == true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notification
          path: .release-notification
          include-hidden-files: true
          retention-days: 1
