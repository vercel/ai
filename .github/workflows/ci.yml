# Vercel CI runs every task tagged `ci` in turbo.json on Linux, including
# `test:node22`, `test:node24` and `test:node26`.
# This workflow covers what Vercel CI can't: Windows.
name: CI

on:
  push:
    branches:
      - main
      - release-v*
  pull_request:

permissions:
  contents: read
  id-token: write

jobs:
  windows:
    name: 'Windows'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3
        with:
          runtime: node@24
          install: false

      # Installing the whole workspace is slow on Windows, so install only the
      # packages with a `test:windows` script and their dependencies.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter "@ai-sdk/mcp..."

      # pnpm's Node.js runtime excludes npm/npx, which the Windows spawn test uses.
      - name: Install npm and npx
        run: pnpm add --global npm@11.19.0

      # GitHub doesn't issue OIDC tokens to fork PRs; they use the local cache only.
      - name: Set up Turborepo Remote Cache
        if: github.repository == 'vercel/ai' && !github.event.pull_request.head.repo.fork
        uses: vercel/setup-turborepo-remote-cache-action@49d7b1b46ba4c9251e1977986bfe18336feabc8f # v1.1.0
        with:
          team: ${{ vars.TURBO_TEAM }}

      # A Windows checkout has CRLF line endings, which end up in the build
      # output. This job reads the remote cache without writing to it, so that
      # the Linux jobs never restore a build from Windows.
      - name: Run Windows tests
        run: pnpm exec turbo run test:windows
        env:
          TURBO_CACHE: local:rw,remote:r
