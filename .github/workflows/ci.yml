name: CI

on:
  push:
    branches: [main, release-v*]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  id-token: write

env:
  # Fork PRs run checks without remote cache credentials.
  TURBO_CACHE: >-
    ${{ github.repository == 'vercel/ai' &&
        (github.event_name == 'push' ||
         (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) &&
        'local:rw,remote:rw' || 'local:rw' }}

jobs:
  packages:
    name: Packages (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    env:
      VITEST_MAX_WORKERS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-ci
        with:
          node-version: ${{ matrix.node }}
      - name: Check packages and repository
        if: matrix.node == 22
        run: pnpm ci:check
      - name: Check runtime compatibility
        if: matrix.node != 22
        run: pnpm exec turbo run test --filter=!@example/* --filter=!ai --concurrency=100% --continue=dependencies-successful
      - name: Upload bundle diagnostics
        if: always() && matrix.node == 22
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundle-size-metafiles
          path: packages/ai/dist-bundle-check/*.json

  ai:
    name: AI (Node ${{ matrix.node }}, shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
        shard: [1/4, 2/4, 3/4, 4/4]
    env:
      VITEST_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-ci
        with:
          node-version: ${{ matrix.node }}
      - run: pnpm exec turbo run test:node test:edge --filter=ai --concurrency=1 --continue=dependencies-successful

  examples:
    name: Examples
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-ci
      # Compiler caches speed up a changed example; Turbo skips unchanged builds.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            examples/*/.next/cache
            examples/*/.angular/cache
          key: ${{ runner.os }}-examples-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-examples-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm ci:examples

  browsers:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Match the installed Playwright version; its browsers and OS libraries are included.
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
      options: --ipc=host
    env:
      PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.61.1-noble
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-ci
      - name: Verify browser image version
        run: node -e "if (process.env.PLAYWRIGHT_IMAGE !== 'mcr.microsoft.com/playwright:v' + require('@playwright/test/package.json').version + '-noble') process.exit(1)"
      - run: pnpm ci:browser
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-test-results
          path: |
            packages/*/test-results.json
            packages/*/test-results/
            packages/*/playwright-report/

  windows:
    name: MCP (Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-ci
        with:
          node-version: '24'
      # pnpm's Node.js runtime excludes npm/npx, which the Windows spawn test uses.
      - name: Install npm and npx
        run: pnpm add --global npm@11.19.0
      - run: pnpm exec turbo run test:node --filter=@ai-sdk/mcp

  load-time:
    name: Load-time benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Timing on shared runners is diagnostic, not a correctness merge gate.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-ci
      - run: pnpm exec turbo run benchmark:load-time --concurrency=1

  required:
    name: CI passed
    runs-on: ubuntu-latest
    needs: [packages, ai, examples, browsers, windows]
    if: always()
    steps:
      - name: Verify mandatory checks
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: test -n "$RESULTS" && ! echo "$RESULTS" | tr ',' '\n' | grep -vx success
