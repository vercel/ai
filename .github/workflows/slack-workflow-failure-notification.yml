name: Slack Workflow Failure Notification

on:
  workflow_run:
    workflows:
      - 'CI'
      - 'Release'
    types:
      - completed
  # Vercel CI reports a commit status instead of running a workflow.
  status:

permissions:
  contents: read
  statuses: read

jobs:
  notify-on-failure:
    runs-on: ubuntu-latest
    # Only notify for CI pushes to main or release branches; notify other
    # workflows as before. For pull requests, head_branch is the source branch
    # and can also be named main or release-v* in a fork.
    if: >-
      ${{
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'failure' &&
          (
            github.event.workflow_run.name != 'CI' ||
            (
              github.event.workflow_run.event == 'push' &&
              (
                github.event.workflow_run.head_branch == 'main' ||
                startsWith(github.event.workflow_run.head_branch, 'release-v')
              )
            )
          )
        ) ||
        (
          github.event_name == 'status' &&
          github.event.context == 'Vercel CI' &&
          (github.event.state == 'failure' || github.event.state == 'error')
        )
      }}

    steps:
      # Vercel CI posts a new failure status each time a task finishes, so only
      # notify for the run's first one, and only for commits on main or a
      # release branch.
      - name: Check for a new Vercel CI failure
        id: vercel-ci
        if: github.event_name == 'status'
        run: |
          if ! jq -e '.branches | any(.name == "main" or (.name | startswith("release-v")))' "$GITHUB_EVENT_PATH" > /dev/null; then
            echo "notify=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          earlier=$(gh api --paginate "repos/$GITHUB_REPOSITORY/commits/$SHA/statuses" \
            --jq '.[] | select(.context == "Vercel CI" and (.state == "failure" or .state == "error") and .target_url == env.TARGET_URL and .id < (env.STATUS_ID | tonumber)) | .id' | wc -l)
          if [ "$earlier" -eq 0 ]; then
            echo "notify=true" >> "$GITHUB_OUTPUT"
          else
            echo "notify=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.sha }}
          STATUS_ID: ${{ github.event.id }}
          TARGET_URL: ${{ github.event.target_url }}

      - name: Send Slack notification
        if: github.event_name != 'status' || steps.vercel-ci.outputs.notify == 'true'
        run: |
          payload=$(jq -n \
            --arg channel_id "$CHANNEL_ID" \
            --arg workflow_name "$WORKFLOW_NAME" \
            --arg workflow_url "$WORKFLOW_URL" \
            '{channel_id: $channel_id, workflow_name: $workflow_name, workflow_url: $workflow_url}')

          curl "$SLACK_WORKFLOW_FAILURE_URL" -X POST -H "Content-Type: application/json" -d "$payload"
        env:
          SLACK_WORKFLOW_FAILURE_URL: ${{ secrets.SLACK_WORKFLOW_FAILURE_URL }}
          CHANNEL_ID: 'C0BU7R72RNW'
          WORKFLOW_NAME: ${{ github.event.workflow_run.name || github.event.context }}
          WORKFLOW_URL: ${{ github.event.workflow_run.html_url || github.event.target_url }}
