name: Slack Workflow Failure Notification

on:
  workflow_run:
    workflows:
      - 'Auto-merge Release PRs'
      - 'Backport'
      - 'CI'
      - 'Release'
    types:
      - completed

permissions:
  actions: read
  checks: read
  contents: read

jobs:
  notify-on-failure:
    runs-on: ubuntu-latest
    # Only branch-filter CI; notify other workflows as before.
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'failure' &&
        (
          github.event.workflow_run.name != 'CI' ||
          github.event.workflow_run.head_branch == 'main' ||
          startsWith(github.event.workflow_run.head_branch, 'release-v')
        )
      }}

    steps:
      - name: Detect expired Backport approval
        id: expired-backport-approval
        if: github.event.workflow_run.name == 'Backport'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ github.token }}
          script: |
            const approvalExpiredMessage =
              'This workflow run required approval but was not approved before it expired.';
            const { owner, repo } = context.repo;
            let approvalExpired = false;

            try {
              const jobs = await github.paginate(
                github.rest.actions.listJobsForWorkflowRun,
                {
                  owner,
                  repo,
                  run_id: context.payload.workflow_run.id,
                  filter: 'latest',
                  per_page: 100,
                },
              );

              for (const job of jobs) {
                const checkRunId = Number(job.check_run_url.split('/').at(-1));

                if (!Number.isInteger(checkRunId)) {
                  core.warning(`Could not determine the check run for ${job.name}.`);
                  continue;
                }

                try {
                  const annotations = await github.paginate(
                    github.rest.checks.listAnnotations,
                    {
                      owner,
                      repo,
                      check_run_id: checkRunId,
                      per_page: 100,
                    },
                  );

                  if (
                    annotations.some(
                      annotation => annotation.message === approvalExpiredMessage,
                    )
                  ) {
                    approvalExpired = true;
                    break;
                  }
                } catch (error) {
                  core.warning(
                    `Could not inspect annotations for ${job.name}: ${error.message}`,
                  );
                }
              }
            } catch (error) {
              core.warning(
                `Could not inspect jobs for the Backport workflow: ${error.message}`,
              );
            }

            core.setOutput('expired', String(approvalExpired));

      - name: Send Slack notification
        if: steps.expired-backport-approval.outputs.expired != 'true'
        run: |
          payload=$(jq -n \
            --arg channel_id "$CHANNEL_ID" \
            --arg workflow_name "$WORKFLOW_NAME" \
            --arg workflow_url "$WORKFLOW_URL" \
            '{channel_id: $channel_id, workflow_name: $workflow_name, workflow_url: $workflow_url}')

          curl "$SLACK_WORKFLOW_FAILURE_URL" -X POST -H "Content-Type: application/json" -d "$payload"
        env:
          SLACK_WORKFLOW_FAILURE_URL: ${{ secrets.SLACK_WORKFLOW_FAILURE_URL }}
          CHANNEL_ID: 'C0BU7R72RNW'
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          WORKFLOW_URL: ${{ github.event.workflow_run.html_url }}
