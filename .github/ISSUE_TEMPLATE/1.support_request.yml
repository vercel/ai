name: Report a bug or request a feature
description: Report a bug, feature request, or other support issue with the AI SDK.
body:
  - type: markdown
    attributes:
      value: |
        Use this template for bugs, feature requests, and support issues.

        High-quality issues are one of the most valuable ways to contribute to AI SDK. For bugs encountered while using the SDK, share what you were building, why you used it that way, and relevant code, logs, versions, or reproductions. When a production/usage report leads to a fix, we will credit the issue author with co-authorship.

        Agent audit issues without additional real usage context do not receive co-authorship. Instead, please [contribute the audit prompts you used](https://github.com/vercel/ai/blob/main/contributing/audit-prompts/README.md). We accept new valuable prompts and meaningful improvements to existing prompts, and grant co-authorship for those prompt contributions.

        Using an agent to investigate or describe a usage problem does not make it an audit bug. Creating a reproduction for an audit finding does not by itself make it a usage bug. See [bug reports and contributor credit](https://github.com/vercel/ai/blob/main/contributing/bug-reports.md).

        If you want to share feedback about the project, community, or contribution process, please use the Feedback issue type instead.
  - type: dropdown
    id: discovery
    attributes:
      label: How was this discovered?
      description: Select the context for a bug report. For feature requests or support questions, select Not applicable.
      options:
        - While using AI SDK (production or development)
        - Through an agent audit of repository code
        - Unsure
        - Not applicable (feature request or support question)
    validations:
      required: true
  - type: textarea
    attributes:
      label: Description
      description: A detailed description. Please include relevant information such as reproduction steps, code examples, expected behavior, actual behavior, logs, and anything else that might help us understand the issue.
      placeholder: |
        Reproduction steps, code examples, expected behavior, actual behavior, background, etc...
    validations:
      required: true
  - type: textarea
    id: usage-context
    attributes:
      label: Usage or audit context
      description: For usage bugs, explain what you were building, how and why you used the SDK, and the impact of the problem. For audits, share the prompt you used or link its contribution PR. You can skip this field for feature requests or support questions.
      placeholder: |
        What I was building and why I used the SDK this way...
        Or: audit prompt and related contribution PR...
    validations:
      required: false
  - type: textarea
    attributes:
      label: Reproduction
      description: Share a minimal repository, StackBlitz, failing test, or small runnable example if you have one. Pull requests with failing tests or reproduction examples are welcome when they help clarify the issue.
      placeholder: |
        Link to reproduction, failing test, or minimal example.
    validations:
      required: false
  - type: textarea
    attributes:
      label: AI SDK Version
      description: Which version of the AI SDK are you using?
      placeholder: |
        Examples:
        - ai: 4.1.2
        - @ai-sdk/react: 2.1.0
        - @ai-sdk/openai: 0.5.2
    validations:
      required: false
  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      description: By submitting this issue, you agree to follow our [Code of Conduct](https://community.vercel.com/guidelines)
      options:
        - label: I agree to follow this project's Code of Conduct
          required: true
